<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos de Café</title>
    <link rel="stylesheet" href="cafe.css" />
</head>
<body>
    <h1>Productos de Café</h1>
    <div class="productos">
        <div class="producto">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/A_small_cup_of_coffee.JPG/320px-A_small_cup_of_coffee.JPG" alt="Café Espresso" />
            <div class="nombre">Café Espresso</div>
            <div class="precio">$50 MXN</div>
        </div>
        <div class="producto">
            <img src="https://cdn.recetasderechupete.com/wp-content/uploads/2021/03/Capuchino-perfecto.jpg" alt="Café Cappuccino"/>
            <div class="nombre">Café Cappuccino</div>
            <div class="precio">$65 MXN</div>
        </div>
        <div class="producto">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlzjPKe41vYOM5dOt0RubVSlXc9fX-PU9U56yr08dmR6_eO9dirAN77gf39cSKMRD5rpg&usqp=CAU" alt="Café Helado" />
            <div class="nombre">Café Helado</div>
            <div class="precio">$55 MXN</div>
        </div>
    </div>
</body>
</html>
